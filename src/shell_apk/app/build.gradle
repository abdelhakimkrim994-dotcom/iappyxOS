plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iappyx.generated.placeholder'
    compileSdk 35

    defaultConfig {
        applicationId "com.iappyx.generated.placeholderx.xxxxxxxx"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1-byte-overlay-test"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Replace the default Java source root so the original iappyxOS classes
    // are not compiled into this minimal standalone experiment.
    sourceSets {
        main {
            java.srcDirs = ['src/byteOverlayTest/java']
        }
    }
}

// No third-party libraries are needed for the overlay-only test APK.

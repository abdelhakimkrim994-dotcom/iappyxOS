name: Build Byte Shared Conversation Spike APK

on:
  workflow_dispatch:
  push:
    branches:
      - byte-shared-conversation-spike

jobs:
  build-shell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x src/shell_apk/gradlew

      - name: Build Android shell APK
        working-directory: src/shell_apk
        run: ./gradlew assembleRelease

      - name: Upload Byte overlay test APK
        uses: actions/upload-artifact@v4
        with:
          name: byte-shared-conversation-spike-apk
          path: src/shell_apk/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
